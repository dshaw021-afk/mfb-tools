name: MFB Bluesky Audit
on:
  push:
    paths:
      - audit_sources.json
      - scripts/audit_bluesky.py
      - .github/workflows/bluesky-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Bluesky counterparts
        run: python scripts/audit_bluesky.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: mfb-bluesky-audit
          path: audit_results.json
