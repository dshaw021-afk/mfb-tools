name: MFB Bluesky Handle Probe
on:
  push:
    paths:
      - scripts/probe_bluesky_handles.py
      - .github/workflows/bluesky-handle-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_bluesky_handles.py
      - uses: actions/upload-artifact@v4
        with:
          name: mfb-bluesky-handle-probe
          path: handle_probe_results.json
